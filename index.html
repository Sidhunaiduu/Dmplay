<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:#080812;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
padding:15px;
}

body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#713cff;
filter:blur(170px);
opacity:.22;
top:-180px;
left:-150px;
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:#3215c9;
filter:blur(160px);
opacity:.25;
bottom:-180px;
right:-100px;
}

.container{
width:100%;
max-width:430px;
position:relative;
z-index:2;
text-align:center;
padding:35px 25px;
background:rgba(20,19,39,.82);
border:1px solid rgba(157,119,255,.25);
border-radius:25px;
box-shadow:0 0 60px rgba(112,60,255,.12);
animation:appear 1s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.badge{
display:inline-flex;
align-items:center;
gap:8px;
padding:9px 15px;
border:1px solid rgba(159,126,255,.3);
border-radius:30px;
background:rgba(125,82,255,.12);
font-size:10px;
letter-spacing:2px;
color:#c7b6ff;
font-weight:bold;
margin-bottom:25px;
}

.dot{
width:7px;
height:7px;
background:#a88aff;
border-radius:50%;
box-shadow:0 0 10px #a88aff;
}

.logo{
width:115px;
height:115px;
margin:0 auto 24px;
border-radius:27px;
overflow:hidden;
border:1px solid rgba(171,139,255,.5);
box-shadow:0 0 35px rgba(137,93,255,.3);
background:#151127;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

h1{
font-size:34px;
font-weight:900;
letter-spacing:2px;
margin-bottom:13px;
}

h1 span{
color:#ad91ff;
}

.subtitle{
color:#aaa8bd;
font-size:13px;
line-height:1.8;
margin-bottom:25px;
}

.divider{
width:65px;
height:3px;
background:linear-gradient(90deg,transparent,#a98aff,transparent);
margin:0 auto 24px;
}

.info{
display:flex;
justify-content:space-around;
padding:17px 8px;
border:1px solid rgba(255,255,255,.07);
border-radius:14px;
background:rgba(255,255,255,.025);
margin-bottom:25px;
}

.info-item strong{
display:block;
font-size:13px;
color:#c5b2ff;
margin-bottom:5px;
}

.info-item small{
font-size:10px;
color:#858398;
letter-spacing:1px;
}

.join-btn{
width:100%;
height:57px;
display:flex;
justify-content:center;
align-items:center;
gap:12px;
border-radius:13px;
text-decoration:none;
color:white;
font-size:14px;
font-weight:900;
letter-spacing:1px;
background:linear-gradient(110deg,#7041e9,#a47aff);
box-shadow:0 8px 30px rgba(119,72,255,.28);
transition:.3s;
}

.join-btn:hover{
transform:translateY(-3px);
box-shadow:0 12px 35px rgba(119,72,255,.4);
}

.join-btn svg{
width:22px;
height:22px;
fill:white;
}

.footer{
margin-top:23px;
color:#69677c;
font-size:10px;
letter-spacing:1.5px;
}

@media(max-width:380px){
h1{font-size:29px;}
.container{padding:28px 19px;}
.logo{width:100px;height:100px;}
}
</style>
</head>
